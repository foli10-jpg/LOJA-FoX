<!doctype html>
<html lang="sq">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Loja: Gjeje Numrin PRO</title>
  <style>
    :root{
      --bg1:#0f172a;
      --bg2:#1e3a8a;
      --card-bg:rgba(255,255,255,0.1);
      --accent:#3b82f6;
      --glass:rgba(255,255,255,0.15);
      font-family:Inter, Arial;
    }
    body{
      margin:0;display:flex;align-items:center;justify-content:center;min-height:100vh;
      background:linear-gradient(135deg,var(--bg1),var(--bg2));color:#eef2ff;
    }
    .card{
      width:100%;max-width:460px;background:var(--glass);
      backdrop-filter:blur(10px);
      padding:28px;border-radius:18px;
      box-shadow:0 10px 35px rgba(0,0,0,0.45);
      animation:fadeIn .7s ease;
    }
    @keyframes fadeIn{from{opacity:0;transform:translateY(15px);}to{opacity:1;transform:translateY(0);}}
    h1{margin:0 0 8px;font-size:22px;text-align:center}
    .lead{text-align:center;margin-bottom:18px;opacity:0.9}
    .row{display:flex;gap:10px;margin-bottom:12px}
    input,button{
      padding:12px;border-radius:10px;border:0;font-size:16px;
    }
    input{flex:1;}
    button{
      background:var(--accent);color:white;font-weight:600;cursor:pointer;
      transition:0.2s;
    }
    button:hover{transform:scale(1.05);box-shadow:0 0 10px #3b82f6aa;}
    .info{min-height:32px;margin-top:12px;font-size:15px;text-align:center}
    .success{color:#7ef58c;font-weight:600;font-size:17px}
    .hint{color:#facc15}
    .meta{display:flex;justify-content:space-between;margin-top:16px;opacity:0.85}
    .footer{text-align:center;margin-top:20px;font-size:13px;opacity:0.7}
    /* Timer */
    #timer{font-weight:600;color:#93c5fd}
  </style>
</head>
<body>
  <main class="card">
    <h1>Loja PRO: Gjeje Numrin</h1>
    <p class="lead">Zgjedh gamën, dhe provo të gjesh numrin e fshehtë me kohëmatës, tinguj dhe statistika!</p>

    <div class="row">
      <input id="min" type="number" value="1" placeholder="Min">
      <input id="max" type="number" value="100" placeholder="Max">
      <button id="start">NIS</button>
    </div>

    <div class="row">
      <input id="guess" type="number" placeholder="Shkruaj numër" disabled>
      <button id="check" disabled>PROVË</button>
    </div>

    <div class="info" id="message">Kliko "NIS" për të filluar lojën.</div>

    <div class="meta">
      <div>Tentativa: <span id="attempts">0</span></div>
      <div>Gama: <span id="range">1 - 100</span></div>
      <div>Kohë: <span id="timer">0s</span></div>
    </div>

    <div class="footer">Loja PRO — HTML + CSS + JS</div>
  </main>

  <audio id="winSound" src="https://assets.mixkit.co/sfx/preview/mixkit-game-level-completed-2059.mp3"></audio>
  <audio id="wrongSound" src="https://assets.mixkit.co/sfx/preview/mixkit-wrong-answer-fail-notification-946.mp3"></audio>

<script>
let secret=null, attempts=0, min=1, max=100;
let timer=0, timerInt=null;

const msg = document.getElementById('message');
const guess = document.getElementById('guess');
const attemptsEl=document.getElementById('attempts');
const rangeEl=document.getElementById('range');
const timerEl=document.getElementById('timer');

const winS=document.getElementById('winSound');
const wrongS=document.getElementById('wrongSound');

function startTimer(){
  timer=0;
  timerEl.textContent='0s';
  timerInt=setInterval(()=>{
    timer++;
    timerEl.textContent=timer+'s';
  },1000);
}
function stopTimer(){ clearInterval(timerInt); }

function setMessage(t,c){ msg.innerHTML=t; msg.className=c||''; }
function rand(a,b){ return Math.floor(Math.random()*(b-a+1))+a; }

start.onclick=()=>{
  min=parseInt(minInput.value)||1;
  max=parseInt(maxInput.value)||100;
  if(min>=max){ setMessage('Gama nuk është e saktë!', 'hint'); return; }

  secret=rand(min,max);
  attempts=0;
  attemptsEl.textContent=0;
  rangeEl.textContent=`${min} - ${max}`;
  setMessage('Lojë nisur! Provo një numër.', '');

  guess.disabled=false;
  check.disabled=false;
  guess.value="";
  guess.focus();

  startTimer();
  console.log('Sekreti:', secret);
};

check.onclick=()=>{
  if(secret===null){ setMessage('Shtyp "NIS".', 'hint'); return; }
  const val=parseInt(guess.value);
  if(isNaN(val)){ setMessage('Shkruaj numër të vlefshëm.', 'hint'); return; }

  attempts++;
  attemptsEl.textContent=attempts;

  if(val===secret){
    setMessage(`Bravo! E gjete: <span class='success'>${secret}</span> në ${attempts} tentativa dhe ${timer}s!`, 'success');
    winS.play();
    stopTimer();
    guess.disabled=true;
    check.disabled=true;
    saveScore();
    return;
  }

  wrongS.play();
  if(val>secret) setMessage('Lart — provo më të vogël.', 'hint');
  else setMessage('Poshtë — provo më të madh.', 'hint');
};

/* Leaderboard */
function saveScore(){
  const best = localStorage.getItem('bestScore');
  const current = { attempts, time:timer };
  if(!best){ localStorage.setItem('bestScore', JSON.stringify(current)); return; }
  const old = JSON.parse(best);
  if(current.time < old.time){ localStorage.setItem('bestScore', JSON.stringify(current)); }
}
</script>
</body>
</html>
